<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Django Form Example</title>
</head>

<body>

<h1>Django Form Example</h1>

<h4>Method: {{ method }}</h4>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <p>
        <input type="submit"
               name="submit_input"
               value="Submit Input">
    </p>

    <p>
        <button type="submit"
                name="button_element"
                value="Button Element">
            Button With <strong>Styled</strong> Text
        </button>
    </p>

</form>

</body>

</html>
