<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Bookr{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="{% url 'welcome_view' %}">Bookr</a>
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'welcome_view' %}">Home</a>
        </li>
      </ul>
      <form class="form-inline" action="{% url 'book_search' %}" method="get">
        <input
          class="form-control mr-sm-2"
          type="search"
          name="search"
          value="{{ search_text }}"
          placeholder="Search"
          aria-label="Search"
          minlength="3"
        />
        <input type="hidden" name="search_in" value="title" />
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </nav>

    <div class="container-fluid">
      {% for message in messages %}
      <div
        class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag }}{% endif %}"
        role="alert"
      >
        {{ message }}
      </div>
      {% endfor %}
      {% block content %}
      <h1>Welcome to Bookr</h1>
      {% endblock %}
    </div>
  </body>
</html>
